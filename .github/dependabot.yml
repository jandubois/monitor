version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
- package-ecosystem: gomod
  directory: /
  schedule:
    interval: weekly
- package-ecosystem: gomod
  directory: /tools
  schedule:
    interval: weekly
- package-ecosystem: npm
  directory: /web/frontend
  schedule:
    interval: weekly
  groups:
    react:
      patterns:
      - react
      - react-dom
- package-ecosystem: docker
  directory: /
  schedule:
    interval: weekly
