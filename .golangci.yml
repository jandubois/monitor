version: "2"

linters:
  settings:
    errcheck:
      exclude-functions:
        # Close errors are typically not actionable
        - (io.Closer).Close
        - (*os.File).Close
        - (*database/sql.DB).Close
        - (*database/sql.Rows).Close
        - (io.ReadCloser).Close
        - (*net/http.Response).Body.Close
